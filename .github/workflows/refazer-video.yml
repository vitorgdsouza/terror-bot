name: Refazer vídeo (mesma história, animação atual)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Número da execução do 'Gerar vídeo' que fez o episódio"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  refazer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar FFmpeg e fontes
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Baixar o roteiro do episódio
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: baixado
      - name: Refazer e mandar no Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          find baixado -type f | head -20
          python -m src.refazer
