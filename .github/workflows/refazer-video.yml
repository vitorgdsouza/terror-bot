name: Refazer vídeo / montar roteiro pronto
run-name: "Refazer ${{ inputs.roteiro || inputs.run_id }}"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Para refazer: número da execução do 'Gerar vídeo' que fez o episódio"
        required: false
        default: ""
      roteiro:
        description: "Ou: roteiro pronto do repositório (ex.: roteiros/fatos_01_antes_de_dormir.json)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read


concurrency:                 # um render por vez: em paralelo estoura a cota da voz e cai na voz reserva
  group: video
  cancel-in-progress: false

jobs:
  refazer:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar FFmpeg e fontes
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Instalar dependências
        run: pip install -r requirements.txt "kaggle>=1.8" six
      - name: Baixar o roteiro do episódio
        if: inputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: baixado
      - name: Refazer e mandar no Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_ESE: ${{ secrets.GEMINI_API_KEY_ESE }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          VOZ_CHAVE: ${{ secrets.VOZ_CHAVE }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ROTEIRO_ARQ: ${{ inputs.roteiro }}
        run: |
          find baixado -type f 2>/dev/null | head -20
          python -m src.refazer

      - name: Guardar o vídeo (para o /postar)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: video-refeito
          path: |
            trabalho/roteiro.json
            trabalho/video/video_final.mp4
          retention-days: 30

      - name: Marcar como pronto para postar
        if: success()
        env:
          ROTEIRO_ARQ: ${{ inputs.roteiro }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "bot-terror"
          git config user.email "bot-terror@users.noreply.github.com"
          git fetch -q origin main && git checkout origin/main -- data/aprovacoes.json || true   # a Mesa salva o "renderizando" depois de disparar o render (só esse arquivo, para não dar conflito no pendente.json)
          [ -n "$ROTEIRO_ARQ" ] && python -m src.aprovacao renderizado || true
          git add data/pendente.json data/previas; [ -e data/aprovacoes.json ] && git add data/aprovacoes.json
          git diff --cached --quiet && exit 0
          git commit -m "Vídeo refeito pronto para postar"
          for tentativa in 1 2 3 4 5; do              # outra execução pode ter salvo ao mesmo tempo: fica com a nossa versão
            git pull --rebase -X theirs --autostash && git push && exit 0
            git rebase --abort 2>/dev/null; sleep $((RANDOM % 15 + 5))
          done
          exit 1
