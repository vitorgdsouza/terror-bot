name: Vídeo longo (E Se Fosse Real?)
run-name: "Longo ${{ inputs.roteiro }} ${{ inputs.blocos }}"

on:
  workflow_dispatch:
    inputs:
      roteiro:
        description: "Roteiro do vídeo longo (ex.: roteiros/esfr/longo_01_planetas.json)"
        required: true
      blocos:
        description: "Só alguns blocos, para teste (ex.: 0,1). Vazio = todos"
        default: ""
      reusar_narracao:
        description: "Números de renders anteriores do longo, separados por vírgula: reaproveita a narração dos blocos que não mudaram (não gasta cota de voz)"
        default: ""

permissions:
  contents: write
  actions: read

concurrency:                 # divide a fila com os Shorts: um render por vez (cota da voz)
  group: video
  cancel-in-progress: false

jobs:
  longo:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar FFmpeg e fontes
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Baixar a narração dos renders anteriores
        if: inputs.reusar_narracao != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.reusar_narracao }}
        run: |
          for id in ${RUNS//,/ }; do
            gh run download "$id" -n narracao-longo -D "cache_narracao/run_$id" || echo "sem narração no run $id"
          done
          find cache_narracao -name vozes.json | sort
      - name: Montar o vídeo longo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_ESE: ${{ secrets.GEMINI_API_KEY_ESE }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ROTEIRO_ARQ: ${{ inputs.roteiro }}
          BLOCOS: ${{ inputs.blocos }}
          NARRACAO_CACHE: ${{ inputs.reusar_narracao != '' && 'cache_narracao' || '' }}
        run: python -m src.longo
      - name: Guardar a narração (para refazer o visual sem gastar a cota)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narracao-longo
          path: |
            trabalho/longo/audio_*/voz_*.mp3
            trabalho/longo/audio_*/vozes.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Guardar o vídeo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-longo
          path: |
            trabalho/longo/video_longo.mp4
            trabalho/capitulos.txt
            trabalho/thumb_longo.jpg
          if-no-files-found: ignore
          retention-days: 30
      - name: Guardar a prévia
        if: success()
        run: |
          git config user.name "bot-terror"
          git config user.email "bot-terror@users.noreply.github.com"
          git add data/previas || true
          git diff --cached --quiet && exit 0
          git commit -m "Prévia do vídeo longo"
          for t in 1 2 3 4 5; do git pull --rebase -X theirs --autostash && git push && exit 0; sleep 9; done
          exit 1
