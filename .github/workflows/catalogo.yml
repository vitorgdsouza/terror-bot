name: Catálogo de imagens (curadoria do formato real)

on:
  workflow_dispatch:
    inputs:
      roteiro:
        description: "Roteiro (ex.: roteiros/fatos_01_real.json)"
        required: true

permissions:
  contents: write

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - name: Montar as folhas de opções
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: rm -rf data/previas/catalogo && python -m src.real "${{ inputs.roteiro }}"
      - name: Guardar
        run: |
          git config user.name "bot-terror"
          git config user.email "bot-terror@users.noreply.github.com"
          git add -A data/previas
          git diff --cached --quiet && exit 0
          git commit -m "Catálogo de imagens para curadoria"
          git pull --rebase --autostash && git push
