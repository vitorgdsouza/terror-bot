name: Teste sons das cenas (Freesound)

on:
  workflow_dispatch:

permissions:
  contents: write             # guarda os sons baixados em data/sons (cada som só é baixado uma vez)

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Baixar sons e mandar amostra no Telegram
        env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.sons --teste
      - name: Guardar os sons baixados
        if: success()
        run: |
          git config user.name "bot-terror"
          git config user.email "bot-terror@users.noreply.github.com"
          git add data/sons
          git diff --cached --quiet && exit 0
          git commit -m "Sons: cache do Freesound"
          git pull --rebase --autostash && git push
