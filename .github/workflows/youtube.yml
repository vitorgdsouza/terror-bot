name: YouTube (relatório e thumbs)

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "relatorio = indicadores do canal no Telegram | thumbs = põe a thumb nos Shorts já postados"
        default: relatorio
      runs:
        description: "execuções antigas com o roteiro de vídeos que não estão em roteiros/ (separadas por espaço)"
        default: "43939945243"
  schedule:
    - cron: "17 12 * * 1"     # toda segunda, 9h17 de Brasília: relatório da semana

permissions:
  contents: write
  actions: read

jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar FFmpeg e fontes
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Baixar roteiros de execuções antigas
        if: github.event.inputs.acao == 'thumbs'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNS: ${{ github.event.inputs.runs }}
        run: |
          for r in $RUNS; do gh run download "$r" -D "baixado/$r" || echo "sem artefato em $r"; done
      - name: Thumbs nos Shorts já postados
        if: github.event.inputs.acao == 'thumbs'
        run: python -m src.thumb_youtube antigas
      - name: Relatório do canal
        if: github.event.inputs.acao != 'thumbs'
        run: python -m src.analise
      - name: Guardar o relatório
        if: github.event.inputs.acao != 'thumbs' && success()
        run: |
          git config user.name "bot-terror"
          git config user.email "bot-terror@users.noreply.github.com"
          git add data/analise
          git diff --cached --quiet && exit 0
          git commit -m "Relatório do YouTube"
          git pull --rebase --autostash && git push
