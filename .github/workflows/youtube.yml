name: YouTube (relatório e thumbs)

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "relatorio = indicadores do canal | thumbs = thumb nos Shorts já postados | uploadpost = testa a conexão do /postar"
        default: relatorio
      runs:
        description: "execuções antigas com o roteiro de vídeos que não estão em roteiros/ (separadas por espaço)"
        default: "43939945243"
  schedule:
    - cron: "17 12 * * 1"     # toda segunda, 9h17 de Brasília: relatório da semana
    - cron: "41 */6 * * *"    # a cada 6 horas: thumb nos Shorts novos que ainda não têm

permissions:
  contents: write
  actions: read

jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar FFmpeg e fontes
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: O que fazer
        id: acao
        run: |
          if [ "${{ github.event.inputs.acao }}" = "uploadpost" ]; then
            echo "acao=uploadpost" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "41 */6 * * *" ] || [ "${{ github.event.inputs.acao }}" = "thumbs" ]; then
            echo "acao=thumbs" >> "$GITHUB_OUTPUT"; else echo "acao=relatorio" >> "$GITHUB_OUTPUT"; fi
      - name: Baixar roteiros de execuções antigas
        if: steps.acao.outputs.acao == 'thumbs'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNS: ${{ github.event.inputs.runs || '43939945243' }}
        run: |
          for r in $RUNS; do gh run download "$r" -D "baixado/$r" || echo "sem artefato em $r"; done
      - name: Thumbs nos Shorts já postados
        if: steps.acao.outputs.acao == 'thumbs'
        run: python -m src.thumb_youtube antigas
      - name: Testar o Upload-Post
        if: steps.acao.outputs.acao == 'uploadpost'
        run: python -m src.postar testar
      - name: Relatório do canal
        if: steps.acao.outputs.acao == 'relatorio'
        run: python -m src.analise
      - name: Guardar relatório e thumbs feitas
        if: always()
        run: |
          git config user.name "bot-terror"
          git config user.email "bot-terror@users.noreply.github.com"
          for f in data/analise data/thumbs_feitas.json; do [ -e "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "YouTube: relatório e thumbs"
          git pull --rebase --autostash && git push
