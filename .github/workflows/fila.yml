name: Fila de postagem (YouTube)

on:
  schedule:
    - cron: "31 14,21 * * *"    # 11h31 e 18h31: AGENDA no YouTube o vídeo da faixa (sai sozinho às 11h47 / 18h47)
  workflow_dispatch:
    inputs:
      acao:
        description: "agendar (padrão: sobe direto no YouTube agendado para a faixa) | postar (Upload-Post) | aviso (manda o texto abaixo no Telegram) | telegram (manda o próximo da fila no Telegram para postar à mão, sem postar)"
        default: agendar
      turno:
        description: "postar: manha (isca) ou tarde (principal)"
        default: manha
      texto:
        description: "aviso: o texto"
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: fila
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar FFmpeg e fontes
        if: github.event.inputs.acao != 'aviso' && github.event.inputs.acao != 'testar'
        timeout-minutes: 6               # o espelho do apt às vezes trava; postar não depende disso
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Aviso no Telegram
        if: github.event.inputs.acao == 'aviso'
        env:
          AVISO: ${{ github.event.inputs.texto }}
        run: python -m src.fila aviso
      - name: Qual é o próximo
        id: prox
        if: github.event.inputs.acao != 'aviso'
        env:
          TURNO: ${{ github.event.inputs.turno }}
          AGENDADO: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: |
          H=$(date -u +%H)
          if [ -z "${{ github.event.inputs.turno }}" ]; then
            if [ "$H" -lt 19 ]; then export TURNO=manha; else export TURNO=tarde; fi
          fi
          echo "turno: $TURNO"
          python -m src.fila proximo
      - name: Baixar o vídeo
        if: steps.prox.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${{ steps.prox.outputs.run_id }}" -D baixado
      - name: Mandar no Telegram para postar à mão
        if: steps.prox.outputs.run_id != '' && github.event.inputs.acao == 'telegram'
        env:
          TITULO_YOUTUBE: ${{ steps.prox.outputs.titulo_youtube }}
          LEGENDA_POST: ${{ steps.prox.outputs.legenda }}
        run: python -m src.postar telegram
      - name: Agendar direto no YouTube
        id: agendar
        if: steps.prox.outputs.run_id != '' && (github.event_name == 'schedule' || github.event.inputs.acao == 'agendar')
        env:
          TITULO_YOUTUBE: ${{ steps.prox.outputs.titulo_youtube }}
          LEGENDA_POST: ${{ steps.prox.outputs.legenda }}
        run: |
          H=$(date -u +%H)
          T="${{ github.event.inputs.turno }}"
          if [ -z "$T" ]; then if [ "$H" -lt 19 ]; then T=manha; else T=tarde; fi; fi
          if [ "$T" = manha ]; then SLOT="$(date -u +%Y-%m-%d)T14:47:00Z"; else SLOT="$(date -u +%Y-%m-%d)T21:47:00Z"; fi
          # faixa já passou: sai daqui a 10 minutos
          if [ "$(date -u -d "$SLOT" +%s)" -lt "$(( $(date -u +%s) + 300 ))" ]; then SLOT="$(date -u -d '+10 minutes' +%Y-%m-%dT%H:%M:00Z)"; fi
          echo "publicar em: $SLOT"
          PUBLICAR_EM="$SLOT" python -m src.agendar_yt
      - name: Postar
        if: steps.prox.outputs.run_id != '' && github.event_name != 'schedule' && github.event.inputs.acao != 'telegram' && github.event.inputs.acao != 'agendar'
        env:
          DA_FILA: "1"
          TITULO_YOUTUBE: ${{ steps.prox.outputs.titulo_youtube }}
          LEGENDA_POST: ${{ steps.prox.outputs.legenda }}
        run: python -m src.postar
      - name: Tirar da fila
        if: steps.prox.outputs.run_id != '' && success() && github.event.inputs.acao != 'telegram'
        env:
          INDICE: ${{ steps.prox.outputs.indice }}
        run: python -m src.fila feito
      - name: Guardar a fila
        if: always()
        run: |
          git config user.name "bot-terror"
          git config user.email "bot-terror@users.noreply.github.com"
          for f in data/fila.json data/thumbs_feitas.json data/agendados.json; do [ -e "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "Fila: postado"
          for t in 1 2 3; do git pull --rebase -X theirs --autostash && git push && exit 0; sleep 7; done
