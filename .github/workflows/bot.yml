name: Bot do Telegram

on:
  schedule:
    - cron: "*/20 * * * *"    # confere os comandos do Telegram a cada 20 minutos
  workflow_dispatch:          # ou rode na mão para conferir agora

permissions:
  contents: write

concurrency:
  group: video
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      USAR_CLAUDE: ${{ vars.USAR_CLAUDE }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: pip install -r requirements.txt "kaggle>=1.8" six

      - name: Ler comandos do Telegram
        id: comandos
        run: python -m src.bot

      - name: Instalar FFmpeg e fontes
        if: steps.comandos.outputs.gerar == 'sim'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Gerar e enviar o vídeo
        if: steps.comandos.outputs.gerar == 'sim'
        env:
          TEMA: ${{ steps.comandos.outputs.tema }}
        run: bash scripts/gerar.sh "$TEMA"

      - name: Salvar histórico de histórias
        if: success()
        run: |
          git config user.name "bot-terror"
          git config user.email "bot-terror@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Histórico e ideias do bot"
          for tentativa in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            echo "Envio recusado, tentando de novo em 10s..."; git rebase --abort 2>/dev/null; sleep 10
          done
          exit 1
